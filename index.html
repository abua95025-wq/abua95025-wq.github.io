<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>M5 F90 Drive</title>
<style>html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;font:900 22px Arial;text-align:center;text-shadow:0 2px 8px #000;pointer-events:none}#ctrl{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;gap:10px}.b{flex:1;height:84px;border-radius:18px;background:rgba(255,255,255,.1);border:2px solid #fff;color:#fff;font:900 13px Arial;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}.b:active{background:rgba(255,255,255,.25)}#gas{background:rgba(46,204,113,.4)}#brake{background:rgba(231,76,60,.4)}</style>
</head>
<body>
<div id="ui"><div id="speed">0 KM/H</div><div style="font-size:11px;opacity:.7">BMW M5 F90 • ГОРОД</div></div>
<canvas id="c"></canvas>
<div id="ctrl"><div style="display:flex;flex:1;gap:10px"><div class="b" id="L">◀ ЛЕВО</div><div class="b" id="R">ПРАВО ▶</div></div><div style="display:flex;flex:1;gap:10px"><div class="b" id="B">ТОРМОЗ</div><div class="b" id="G">ГАЗ</div></div></div>
<script>
const cv=c,ctx=cv.getContext('2d');let W,H;function rs(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}rs();addEventListener('resize',rs);
let x=0,y=0,ang=-1.5708,v=0,inp={l:0,r:0,g:0,b:0};
let houses=[];for(let i=-20;i<=20;i++)for(let j=-20;j<=20;j++){if(i==0&&j==0)continue;if(Math.random()<0.65)houses.push({x:i*180+Math.random()*60,y:j*180+Math.random()*60,w:60+Math.random()*50,h:60+Math.random()*50})}
function upd(){
let a=0;if(inp.g)a=0.28;if(inp.b)a=-0.6;
v+=a;if(!inp.g&&!inp.b)v*=0.985;v=Math.max(-3.5,Math.min(13.8,v));
if(Math.abs(v)>0.4){let t=0;if(inp.l)t=-1;if(inp.r)t=1;ang+=t*0.038*Math.max(0.35,Math.abs(v)/8)}
x+=Math.cos(ang)*v;y+=Math.sin(ang)*v;
for(let h of houses){if(Math.abs(x-h.x)<h.w/2+14&&Math.abs(y-h.y)<h.h/2+14){x-=Math.cos(ang)*v*1.5;y-=Math.sin(ang)*v*1.5;v*=0.3}}
speed.innerText=Math.abs(v*23|0)+' KM/H';
}
function draw(){
ctx.fillStyle='#1a252f';ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-ang+1.5708);ctx.translate(-x,-y);
ctx.fillStyle='#222f3a';ctx.fillRect(-5000,-5000,10000,10000);
ctx.strokeStyle='#2c3e50';ctx.lineWidth=100;for(let i=-5000;i<=5000;i+=180){ctx.beginPath();ctx.moveTo(i,-5000);ctx.lineTo(i,5000);ctx.stroke();ctx.beginPath();ctx.moveTo(-5000,i);ctx.lineTo(5000,i);ctx.stroke()}
ctx.strokeStyle='#f1c40f';ctx.lineWidth=2;ctx.setLineDash([20,20]);for(let i=-5000;i<=5000;i+=180){ctx.beginPath();ctx.moveTo(i,-5000);ctx.lineTo(i,5000);ctx.stroke();ctx.beginPath();ctx.moveTo(-5000,i);ctx.lineTo(5000,i);ctx.stroke()}ctx.setLineDash([]);
houses.forEach(b=>{ctx.fillStyle='#0e1a24';ctx.fillRect(b.x-b.w/2-8,b.y-b.h/2-8,b.w+16,b.h+16);ctx.fillStyle='#1e2f40';ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.fillStyle='#2c3e50';ctx.fillRect(b.x-b.w/2+5,b.y-b.h/2+5,b.w-10,5);ctx.fillStyle='#f1c40f';for(let k=0;k<3;k++)ctx.fillRect(b.x-b.w/2+8+k*14,b.y-b.h/2+15,5,5)});
ctx.save();ctx.translate(x,y);ctx.rotate(ang);
ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,8,15,28,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#0b3d91';ctx.fillRect(-12,-26,24,52);
ctx.fillStyle='#061e48';ctx.fillRect(-12,-26,24,7);ctx.fillRect(-12,21,24,7);
ctx.fillStyle='#b8dcff';ctx.fillRect(-10,-7,20,14);
ctx.fillStyle='#111';ctx.fillRect(-14,-18,4,7);ctx.fillRect(10,-18,4,7);ctx.fillRect(-14,12,4,7);ctx.fillRect(10,12,4,7);
ctx.fillStyle='#ffe600';ctx.fillRect(-9,-27,4,2);ctx.fillRect(5,-27,4,2);
ctx.restore();ctx.restore();
}
(function loop(){upd();draw();requestAnimationFrame(loop)})();
function bind(id,k){let el=document.getElementById(id);let d=e=>{e.preventDefault();inp[k]=1},u=e=>{inp[k]=0};el.addEventListener('touchstart',d,{passive:false});el.addEventListener('touchend',u);el.addEventListener('mousedown',d);el.addEventListener('mouseup',u);el.addEventListener('mouseleave',u)}
bind('G','g');bind('B','b');bind('L','l');bind('R','r');
addEventListener('keydown',e=>{if(e.key=='ArrowUp'||e.code=='KeyW')inp.g=1;if(e.key=='ArrowDown'||e.code=='KeyS')inp.b=1;if(e.key=='ArrowLeft'||e.code=='KeyA')inp.l=1;if(e.key=='ArrowRight'||e.code=='KeyD')inp.r=1});
addEventListener('keyup',e=>{if(e.key=='ArrowUp'||e.code=='KeyW')inp.g=0;if(e.key=='ArrowDown'||e.code=='KeyS')inp.b=0;if(e.key=='ArrowLeft'||e.code=='KeyA')inp.l=0;if(e.key=='ArrowRight'||e.code=='KeyD')inp.r=0});
</script>
</body>
</html>
