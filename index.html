<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS AK-47 AUTO</title>
<style>
body{margin:0;background:#1a1a1a;color:white;font-family:Arial;overflow:hidden}
#top{position:absolute;top:0;left:0;width:100%;background:black;padding:12px 20px;display:flex;justify-content:space-between;font-size:20px;font-weight:bold;box-sizing:border-box;z-index:10}
#game{width:100vw;height:100vh;background:radial-gradient(#333,#111);position:relative;cursor:none}
.enemy{position:absolute;width:75px;height:75px;background:gold;border:3px solid black;border-radius:50%;display:flex;align-items:center;justify-content:center;color:black;font-size:35px;font-weight:bold}
#gun{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:50px;pointer-events:none}
#cross{position:absolute;pointer-events:none;z-index:20;font-size:28px;color:red;font-weight:bold;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<div id="top"><div>СЧЕТ: <span id="score">0</span></div><div>АК-47: <span id="ammo">30/90</span></div></div>
<div id="game">
<div id="cross">+</div>
<div id="gun">🔫</div>
</div>
<script>
let score=0, ammo=30, reserve=90, isFiring=false, fireLoop
const scoreEl=document.getElementById('score')
const ammoEl=document.getElementById('ammo')
const game=document.getElementById('game')
const cross=document.getElementById('cross')

document.addEventListener('mousemove', e=>{
  cross.style.left=e.clientX+'px'
  cross.style.top=e.clientY+'px'
})

function updateAmmo(){ ammoEl.textContent=ammo+'/'+reserve }

function spawnEnemy(){
  const el=document.createElement('div')
  el.className='enemy'
  el.textContent='-'
  el.style.left=Math.random()*(window.innerWidth-80)+'px'
  el.style.top=Math.random()*(window.innerHeight-150)+70+'px'
  game.appendChild(el)
  setTimeout(()=>{ if(el.parentNode) el.remove() }, 2500)
}

function shoot(){
  if(ammo<=0){
    if(reserve>0){ ammo=30; reserve-=30; updateAmmo() }
    return
  }
  ammo--; updateAmmo()
  const x=parseInt(cross.style.left)
  const y=parseInt(cross.style.top)
  const under=document.elementsFromPoint(x,y)
  const target=under.find(e=>e.classList.contains('enemy'))
  if(target){
    score+=10
    scoreEl.textContent=score
    target.remove()
  }
}

game.addEventListener('mousedown', ()=>{
  isFiring=true
  shoot()
  fireLoop=setInterval(shoot, 80)
})
game.addEventListener('mouseup', ()=>{
  isFiring=false
  clearInterval(fireLoop)
})

setInterval(spawnEnemy, 700)
updateAmmo()
</script>
</body>
</html>
