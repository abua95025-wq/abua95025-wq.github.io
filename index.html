<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEGA</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:10px}div{max-width:700px;margin:auto;border:2px solid #0f0;padding:15px;box-shadow:0 0 20px #0f0}button{background:#000;color:#0f0;border:1px solid #0f0;padding:8px;margin:3px}input{width:95%;padding:10px;background:#111;color:#0f0;border:1px solid #0f0}</style></head><body><div><h1>MEGA ESCAPE - ВСЕ ВМЕСТЕ</h1><p id="hud"></p><div id="story" style="color:#0ff;border-left:3px solid #0ff;padding:10px;background:#111"></div><p id="desc"></p><p id="inv"></p><input id="cmd" placeholder="команда..."><br><button onclick="go()">ВВОД</button><button onclick="cmd('осмотреться')">осмотреться</button><button onclick="cmd('перейти')">перейти</button><div id="log"></div></div><script>
let lives=3,inv=[],room=0;let beep=f=>{try{let a=new AudioContext(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),200)}catch(e){}};
let R=[{n:"1 УПРАВЛЕНИЕ",d:"На столе КАРТА - осмотреться",s:"Дневник: ИИ ABU-3000 запер двери. Он учится...",i:"карта",q:""},{n:"2 СЕРВЕРНАЯ",d:"Загадка 15+27=? Введи 42",s:"Сервера плавятся! Код 42!",i:"",q:"42",qi:"ключ"},{n:"3 ЛАБОРАТОРИЯ",d:"Введи выход наоборот - дохыв",s:"Профессор писал задом наперед",i:"",q:"дохыв",qi:"чип"},{n:"4 СКЛАД",d:"Тут ФОНАРИК - осмотреться",s:"Записка: забрал фонарик, иду в туннель",i:"фонарик",q:""},{n:"5 ТУННЕЛЬ",d:"ТЕМНО! Пиши свет",s:"Кровью: НЕ ВКЛЮЧАЙ СВЕТ - ОН ВИДИТ",i:"",q:"свет",qi:"лом"},{n:"6 БОСС ВЫХОД",d:"Пароль: abu - имя ИИ",s:"ИИ: ТЫ НЕ УЙДЕШЬ! Останься!",i:"",q:"abu",qi:"WIN"}];
function render(){if(room>=6){document.body.innerHTML="<h1>🏆 ПОБЕДА! Ты сбежал! Собрал: "+inv.join(", ")+"</h1><button onclick='location.reload()'>Заново</button>";beep(1000);return;}let r=R[room];document.getElementById("hud").innerText="❤️"+lives+" | Комната "+(room+1)+"/6 | Карта: "+(room+1)+"/6";document.getElementById("story").innerText=r.s;document.getElementById("desc").innerText=r.d;document.getElementById("inv").innerText="🎒 "+(inv.join(", ")||"пусто");}
function cmd(t){document.getElementById("cmd").value=t;go();}
function go(){let c=document.getElementById("cmd").value.toLowerCase().trim();let r=R[room];let log=document.getElementById("log");if(c=="осмотреться"){if(r.i&&!inv.includes(r.i)){inv.push(r.i);beep(700);log.innerHTML+="<p style='color:yellow'>+ Нашел: "+r.i+" 🔊</p>"}else log.innerHTML+="<p>Ничего</p>"}else if(c=="перейти"){if(r.q){log.innerHTML+="<p style='color:red'>Реши загадку!</p>";beep(100)}else{room++;beep(500);log.innerHTML+="<p style='color:#0ff'>Перешел...</p>"}}else if(r.q&&c==r.q){if(r.qi){inv.push(r.qi);beep(900);log.innerHTML+="<p style='color:#0f0'>Верно! +"+r.qi+" 🔊</p>"}room++;if(r.qi=="WIN")room=6;}else if(c!=""){lives--;beep(100);log.innerHTML+="<p style='color:red'>-1 жизнь!</p>";if(lives<=0){document.body.innerHTML="<h2>💀 GAME OVER</h2><button onclick='location.reload()'>Заново</button>";return;}}document.getElementById("cmd").value="";render();}
render();
</script></body></html>
