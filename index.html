1<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SUBWAY SURF 3D</title>
<style>
*{margin:0;overflow:hidden}body{background:#000}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:10px;left:0;width:100%;display:flex;justify-content:space-around;color:#fff;font-family:monospace;font-size:20px;text-shadow:0 0 10px #0ff;pointer-events:none}
#menu{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(#222,#000);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-family:monospace;z-index:5}
.btn{padding:15px 50px;background:#0ff;color:#000;border:none;font-size:22px;border-radius:12px;margin-top:20px;cursor:pointer;box-shadow:0 0 20px #0ff}
#ctrl{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-around;z-index:4}
.cbtn{width:90px;height:90px;background:rgba(0,255,255,0.15);border:2px solid #0ff;border-radius:20px;color:#0ff;font-size:30px}
</style>
</head>
<body>
<div id="hud"><span>💰 <b id="c">0</b></span><span>🏃 <b id="d">0</b>m</span><span>❤️ <b id="l">3</b></span></div>
<canvas id="cv"></canvas>
<div id="ctrl"><button class="cbtn" onclick="move(-1)">◀</button><button class="cbtn" onclick="jump()">▲</button><button class="cbtn" onclick="move(1)">▶</button></div>
<div id="menu"><h1 style="font-size:40px;color:#0ff;text-shadow:0 0 30px #0ff">SUBWAY SURF 3D</h1><p style="margin:10px">🚇 Abu Edition • 3D Perspective</p><p style="font-size:11px;color:#888">Свайп / A D / стрелки • Прыжок W / SPACE</p><button class="btn" onclick="start()">ИГРАТЬ</button></div>
<script>
let cv=document.getElementById("cv"),ctx=cv.getContext("2d");
cv.width=innerWidth; cv.height=innerHeight;
let W=cv.width,H=cv.height, CX=W/2, lane=1, coins=0, dist=0, lives=3, playing=false, y=H-150, vy=0, jumping=false, speed=8, objs=[];
let beep=f=>{try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=0.2;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>o.stop(),120)}catch(e){}};
function laneX(l, depth){let vanish=CX; let spread=W*0.4*(depth); let center=vanish; return center + (l-1)*spread;}
function start(){document.getElementById("menu").style.display="none"; playing=true; objs=[]; coins=0;lives=3;dist=0;lane=1;speed=8; loop(); spawner();}
function spawner(){if(!playing)return; let r=Math.random(); if(r<0.04){objs.push({type:"train",lane:Math.floor(Math.random()*3),z:0,w:80,h:120,color:"#e33"});}else if(r<0.12){objs.push({type:"coin",lane:Math.floor(Math.random()*3),z:0});} setTimeout(spawner,180);}
function move(d){lane=Math.max(0,Math.min(2,lane+d)); beep(500);}
function jump(){if(!jumping){vy=-22; jumping=true; beep(700);}}
function loop(){
if(!playing)return; ctx.clearRect(0,0,W,H);
// sky
let grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,"#112"); grad.addColorStop(1,"#000"); ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
// perspective rails
ctx.strokeStyle="#444"; ctx.lineWidth=2;
for(let i=0;i<=3;i++){ // rail lines
ctx.beginPath(); for(let z=0;z<=1;z+=0.02){let d=z; let x=CX + (i-1.5)*W*0.6*d - (i==1||i==2?W*0.15*d:0); let yy=H*d*0.8; if(z==0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);} ctx.stroke();
}
// objs sorted far->near
objs.sort((a,b)=>a.z-b.z);
for(let k=objs.length-1;k>=0;k--){
let o=objs[k]; o.z+=0.008*speed/8; if(o.z>1){objs.splice(k,1); continue;}
let scale=o.z; let px=laneX(o.lane, o.z); let py=H*o.z*0.85; let s=20+scale*80;
if(o.type=="coin"){
ctx.fillStyle="gold"; ctx.shadowColor="gold"; ctx.shadowBlur=15;
ctx.beginPath(); ctx.arc(px,py,s*0.25,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
ctx.fillStyle="#ff0"; ctx.font=s*0.3+"px monospace"; ctx.fillText("$",px-4,py+4);
if(o.z>0.82 && o.lane==lane &&!jumping){coins++; beep(1200); objs.splice(k,1);}
}else{
let w=s*0.9, h=s*1.2;
ctx.fillStyle=o.color; ctx.fillRect(px-w/2,py-h,w,h);
ctx.fillStyle="#300"; ctx.fillRect(px-w/2,py-h,w,h*0.2);
ctx.fillStyle="#fff"; ctx.fillRect(px-w/2+5,py-h+15, w-10,10);
if(o.z>0.78 && o.z<0.92 && o.lane==lane &&!jumping){
lives--; beep(80); objs.splice(k,1); navigator.vibrate&&navigator.vibrate(100);
if(lives<=0){gameOver(); return;}
}
}
}
// player shadow and player
ctx.fillStyle="rgba(0,255,255,0.3)"; ctx.beginPath(); ctx.ellipse(laneX(lane,0.9),H*0.9,30,10,0,0,Math.PI*2); ctx.fill();
y+=vy; vy+=1.2; if(y>=H-150){y=H-150; vy=0; jumping=false;}
let pX=laneX(lane,0.92), pY=y;
ctx.fillStyle="#0ff"; ctx.shadowColor="#0ff"; ctx.shadowBlur=20;
ctx.fillRect(pX-18,pY-45,36,45); ctx.fillStyle="#fff"; ctx.fillRect(pX-12,pY-55,24,18);
ctx.shadowBlur=0;
dist+=0.2; speed+=0.01;
document.getElementById("c").innerText=coins;
document.getElementById("d").innerText=Math.floor(dist);
document.getElementById("l").innerText=lives;
requestAnimationFrame(loop);
}
function gameOver(){playing=false; document.getElementById("menu").innerHTML=`<h1 style="color:#f33">💥 CRASH!</h1><p>Монет: ${coins}<br>Дистанция: ${Math.floor(dist)}m</p><button class="btn" onclick="location.reload()">Заново</button>`; document.getElementById("menu").style.display="flex"; beep(50);}
addEventListener("keydown",e=>{if(e.key=="ArrowLeft"||e.key=="a")move(-1); if(e.key=="ArrowRight"||e.key=="d")move(1); if(e.key=="ArrowUp"||e.key=="w"||e.key==" ")jump();});
let sx=0; cv.addEventListener("touchstart",e=>sx=e.touches[0].clientX); cv.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>25)move(dx>0?1:-1); else jump();});
addEventListener("resize",()=>{cv.width=innerWidth;cv.height=innerHeight; W=cv.width;H=cv.height;CX=W/2;});
</script>
</body>
</html>
