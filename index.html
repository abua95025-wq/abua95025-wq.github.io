<!DOCTYPE html><html><body style="margin:0;background:#a0e0ff;text-align:center">
<h1>⭐ STAR JUMP - ЖМИ ПРОБЕЛ ⭐</h1>
<canvas id="c" width="600" height="400" style="background:#fff;border:4px solid #000"></canvas>
<script>
let c=document.getElementById('c'),x=c.getContext('2d'),py=300,vy=0,score=0,sx=600;
setInterval(()=>{
 vy+=0.8; py+=vy; if(py>330){py=330; vy=0}
 if(py<0)py=0;
 sx-=5; if(sx<-30){sx=600; score++}
 if(Math.abs(sx-100)<30 && py>250){alert('БАМ! Score:'+score); sx=600; score=0}
 x.clearRect(0,0,600,400);
 x.fillStyle='#ffdd00'; x.fillRect(sx,320,30,30);
 x.fillStyle='#7ed957'; x.fillRect(100,py,30,30);
 x.fillStyle='#000'; x.font='20px Arial'; x.fillText('Score:'+score,10,20);
},20);
window.onkeydown=e=>{if(e.code=='Space')vy=-12}
c.onclick=()=>vy=-12
</script>
<p>ЖМИ ПРОБЕЛ ЧТОБЫ ПРЫГАТЬ, ОБХОДИ ЖЕЛТЫЕ КУБИКИ</p>
</body></html>
