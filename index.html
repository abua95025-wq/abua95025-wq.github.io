<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESCAPE - Рабочая версия</title>
<style>
body{background:#111;color:#0f0;font-family:monospace;padding:15px;max-width:600px;margin:auto}
h1{border:2px solid #0f0;padding:10px;text-align:center}
.box{border:1px solid #0f0;padding:10px;margin:10px 0;background:#000}
input{width:100%;padding:10px;background:#000;color:#0f0;border:1px solid #0f0;font-size:16px}
button{background:#000;color:#0f0;border:1px solid #0f0;padding:8px 12px;margin:3px;cursor:pointer}
button:hover{background:#0f0;color:#000}
</style>
</head>
<body>
<h1>💻 ESCAPE</h1>
<div class="box">❤️ Жизни: <span id="lives">3</span> | Комната: <span id="room">1/4</span></div>
<div class="box" id="story"></div>
<div class="box" id="desc"></div>
<div class="box">🎒 <span id="inv">пусто</span></div>
<input id="cmd" placeholder="> пиши команду..." onkeydown="if(event.key==='Enter')go()">
<br>
<button onclick="act('осмотреться')">осмотреться</button>
<button onclick="act('перейти')">перейти</button>
<button onclick="act('помощь')">помощь</button>
<div class="box" id="log" style="min-height:80px"></div>
<p style="font-size:11px;color:#555">Пасхалки: попробуй ввести abu, god, help, 42, кто я</p>

<script>
let lives=3, inv=[], room=0;
let beep=f=>{try{let a=new AudioContext(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),150)}catch(e){}};

let R=[
{n:"1. УПРАВЛЕНИЕ", d:"На столе КАРТА. Напиши 'осмотреться' чтобы взять.", s:"Дневник: ИИ запер нас. Ищи выход!"},
{n:"2. СЕРВЕРНАЯ", d:"Пароль на двери: 15+27=? Ответ: 42", s:"Сервера гудят. Код 42 открывает дверь."},
{n:"3. СКЛАД", d:"Тут лежит ФОНАРИК. Команда 'осмотреться'.", s:"Записка: В туннеле темно, нужен фонарик."},
{n:"4. ВЫХОД", d:"Темно! Напиши 'свет' чтобы включить фонарик и сбежать.", s:"Выход близко! Нужен фонарик."}
];

function render(){
if(room>=4){document.body.innerHTML="<h1>🏆 ПОБЕДА! Ты сбежал!<br><br>Нашел: "+inv.join(", ")+"<br><button onclick='location.reload()'>Заново</button></h1>";beep(1000);return;}
let r=R[room];
document.getElementById("lives").innerText=lives;
document.getElementById("room").innerText=(room+1)+"/4";
document.getElementById("story").innerText=r.s;
document.getElementById("desc").innerText=r.d;
document.getElementById("inv").innerText=inv.join(", ")||"пусто";
}

function act(t){document.getElementById("cmd").value=t;go();}

function go(){
let c=document.getElementById("cmd").value.toLowerCase().trim();
let log=document.getElementById("log");
let msg="";

if(c=="осмотреться"){
 if(room==0 &&!inv.includes("карта")){inv.push("карта"); beep(800); msg="<p style='color:yellow'>+ карта 🗺️ 🔊</p>";}
 else if(room==2 &&!inv.includes("фонарик")){inv.push("фонарик"); beep(800); msg="<p style='color:yellow'>+ фонарик 🔦 🔊</p>";}
 else msg="<p>Тут пусто</p>";
}
else if(c=="перейти"){
 if(room==1){msg="<p style='color:red'>Нужен код! Введи 42</p>"; beep(200);}
 else if(room==3 &&!inv.includes("фонарик")){msg="<p style='color:red'>Без фонарика не пойду! Темно!</p>"; beep(200);}
 else{room++; beep(500); msg="<p style='color:#0ff'>Перешел в комнату "+(room+1)+"</p>";}
}
else if(c=="42" && room==1){room++; beep(1000); msg="<p style='color:#0f0'>Верно! Дверь открылась 🔊</p>";}
else if(c=="свет" && room==3){room=4; beep(1000); msg="<p style='color:#0f0'>Свет включен! Вижу выход!</p>";}
// ПАСХАЛКИ
else if(c=="abu"){msg="<p style='color:#0ff'>👋 Привет, создатель! Ты мой автор! +1 жизнь</p>"; lives++; beep(1200);}
else if(c=="god" || c=="бог"){msg="<p style='color:gold'>😇 Чит-код! + ключ от всех дверей</p>"; inv.push("божественный ключ"); beep(1500);}
else if(c=="помощь" || c=="help"){msg="<p>Команды: осмотреться, перейти, 42, свет<br>Пасхалки: abu, god, кто я, 42</p>";}
else if(c=="кто я"){msg="<p>Ты Abu - хакер который взламывает ИИ! 💻</p>"; beep(600);}
else if(c!=""){lives--; beep(100); msg="<p style='color:red'>Неверно! -1 жизнь: "+c+"</p>"; if(lives<=0){document.body.innerHTML="<h1>💀 GAME OVER<br><button onclick='location.reload()'>Заново</button></h1>";return;}}

document.getElementById("cmd").value="";
render();
log.innerHTML=msg+log.innerHTML;
}
render();
</script>
</body>
</html>
