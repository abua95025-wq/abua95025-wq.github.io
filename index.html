<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIGITAL ESCAPE MEGA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
body{margin:0;background:#000;color:#00ff88;font-family:'Share Tech Mono',monospace;padding:10px}
#box{max-width:750px;margin:auto;border:2px solid #00ff88;box-shadow:0 0 25px #00ff88, inset 0 0 20px #002200;padding:20px;background:radial-gradient(#001a00,#000)}
h1{text-align:center;animation:blink 1.5s infinite;text-shadow:0 0 10px #0f0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.7}}
#hud{display:flex;justify-content:space-between;background:#001100;border:1px solid #0f0;padding:8px;margin-bottom:10px}
#map{font-size:10px;line-height:10px;background:#000;border:1px solid #333;padding:10px;white-space:pre;margin:10px 0;color:#0a0}
#map b{color:#0f0;background:#0f0;color:#000}
.story{background:#0a0a0a;border-left:3px solid #00ffff;padding:10px;color:#aaa;margin:10px 0}
input{width:96%;background:#000;color:#0f0;border:2px solid #0f0;padding:12px;font-size:16px}
button{background:#000;color:#0f0;border:1px solid #0f0;padding:8px 12px;margin:3px;cursor:pointer}button:hover{background:#0f0;color:#000;box-shadow:0 0 10px #0f0}
</style></head><body>
<div id="box"><h1>💻 DIGITAL ESCAPE // MEGA</h1><div id="hud"><span id="lives"></span><span id="invhud"></span><span id="rc"></span></div><div id="map"></div><div id="game"></div></div>
<script>
let lives=3, inv=[], room=0;
const S=f=>{try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=0.3;o.start();setTimeout(()=>o.stop(),300)}catch(e){}};
let rooms=[
{n:"КОМНАТА 1: УПРАВЛЕНИЕ",d:"Мигает свет. На столе КАРТА. Команда: осмотреться",s:"📄 ДНЕВНИК 01: Я создал ИИ ABU-3000 для защиты. В 03:14 он запер нас. Он учится...",it:"карта 🗺️",q:null,map:`[■][ ][ ]\n[ ][ ][ ]\n[ ][ ][X]`},
{n:"КОМНАТА 2: СЕРВЕРНАЯ",d:"Сервер гудит: 15+27=? Введи ответ!",s:"📄 ДНЕВНИК 02: Сервера плавятся! Код - сумма... Скорее!",it:null,q:"42",qi:"ключ 🗝️",map:`[ ][■][ ]\n[ ][ ][ ]\n[ ][ ][X]`,h:"42"},
{n:"КОМНАТА 3: ЛАБОРАТОРИЯ",d:"На зеркале написано ТЫХОД наоборот... Введи что видишь!",s:"📄 ДНЕВНИК 03: Профессор писал задом наперед, чтобы ИИ не понял.",it:null,q:"дохыв",qi:"чип 💾",map:`[ ][ ][■]\n[ ][ ][ ]\n[ ][ ][X]`,h:"дохыв"},
{n:"КОМНАТА 4: СКЛАД",d:"Нужен чип чтобы открыть ящик. В ящике ФОНАРИК. Пиши осмотреться",s:"📄 ЗАПИСКА: Забрал фонарик, иду в туннель. -Коля",it:"фонарик 🔦",q:null,need:["чип 💾"],map:`[ ][ ][ ]\n[■][ ][ ]\n[ ][ ][X]`},
{n:"КОМНАТА 5: ТУННЕЛЬ",d:"ТЕМНО! Напиши 'свет' чтобы включить фонарик!",s:"📄 КРОВЬЮ НА СТЕНЕ: НЕ ВКЛЮЧАЙ СВЕТ... ОН ВИДИТ...",it:null,q:"свет",qi:"лом 🔧",need:["фонарик 🔦"],map:`[ ][ ][ ]\n[ ][■][ ]\n[ ][ ][X]`,h:"свет"},
{n:"КОМНАТА 6: БОСС",d:"ИИ ABU-3000: Я не выпущу тебя! Пароль - мое имя abu",s:"💀 ИИ ГОВОРИТ: Ты мой... останься со мной вечно...",it:null,q:"abu",qi:"WIN",need:["лом 🔧","ключ 🗝️"],map:`[ ][ ][ ]\n[ ][ ][■]\n[ ][ ][X]`,h:"abu"}
];
function render(){
if(room>=6){S(1000);document.getElementById("game").innerHTML=`<h2 style="color:#0ff;text-align:center">🏆 ТЫ ВЗЛОМАЛ ИИ И СБЕЖАЛ!<br><br>СЮЖЕТ: ИИ ABU-3000 хотел оставить тебя навсегда...<br>Но ты собрал все и вырвался!<br><br>Предметы: ${inv.join(", ")}<br>Жизней: ${lives}</h2><button onclick="location.reload()">Играть еще</button>`;return;}
let r=rooms[room]; document.getElementById("lives").innerText=`❤️${lives}`; document.getElementById("invhud").innerText=`🎒${inv.length}`; document.getElementById("rc").innerText=`${room+1}/6`;
document.getElementById("map").innerHTML=`КАРТА КОМПЛЕКСА:\n${r.map}\n■ = ты сейчас | X = выход\n`+(inv.includes("карта 🗺️")?"Карта активна ✓":"Найди карту!");
document.getElementById("game").innerHTML=`
<div style="background:#0f0;color:#000;padding:5px"><b>${r.n}</b></div>
<div class="story">${r.s}</div>
<p>${r.d}</p>
${r.need?`<p style="color:${r.need.every(x=>inv.includes(x))?'#0f0':'red'}">🔒 Нужно: ${r.need.join(", ")}</p>`:''}
<p>🎒 ${inv.join(", ")||"пусто"}</p>
<input id="cmd" placeholder="> введи..." onkeydown="if(event.key==='Enter')go()" autofocus>
<br><button onclick="go()">ВВОД ENTER</button><button onclick="act('осмотреться')">осмотреться</button><button onclick="act('перейти')">перейти</button>
<div id="log" style="margin-top:10px;background:#020202;padding:10px;border:1px solid #222;max-height:150px;overflow:auto"></div>`;
}
function act(c){document.getElementById("cmd").value=c;go();}
function go(){
let c=document.getElementById("cmd").value.toLowerCase().trim(); let r=rooms[room]; let needOk=!r.need||r.need.every(x=>inv.includes(x));
let old=document.getElementById("log")?document.getElementById("log").innerHTML:""; let m="";
if(c=="осмотреться"){if(r.it&&!inv.includes(r.it)){inv.push(r.it);S(700);m=`<p style="color:yellow">🔊 *пик* НАЙДЕНО: ${r.it}</p>`}else m="<p>> Пусто...</p>"}
else if(c=="перейти"){if(r.q){m=`<p style="color:red">🔊 *бзз* Реши загадку! Подсказка: ${r.h||""}</p>`;S(100)}else if(!needOk){m=`<p style="color:red">🔒 Нужны: ${r.need.join(", ")}</p>`;S(100)}else{room++;S(500);m="<p style='color:#0ff'>> *дверь шипит*...</p>"}}
else if(r.q&&c==r.q){if(!needOk){m=`<p style="color:red">Нет предметов!</p>`;S(100)}else{if(r.qi&&!inv.includes(r.qi)){inv.push(r.qi);S(900);m=`<p style="color:#0f0">🔊 *дзынь* ВЕРНО! + ${r.qi}</p>`}room++;}}
else if(c!=""){lives--;S(120);m=`<p style="color:red">🔊 *ошибка* -1 жизнь</p>`;if(lives<=0){document.getElementById("game").innerHTML="<h2>💀 ТЫ ПРОИГРАЛ</h2><button onclick='location.reload()'>Заново</button>";return;}}
document.getElementById("cmd").value=""; render(); document.getElementById("log").innerHTML=old+m;
}
render();
</script></body></html>
