<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Змейка 30 сек</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column}
#top{display:flex;gap:20px;font-size:20px;margin-bottom:10px}
canvas{background:#1a1a2e;border:3px solid white;border-radius:10px}
#start{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;text-align:center}
#play{padding:15px 50px;font-size:30px;background:lime;border:none;border-radius:30px;font-weight:bold}
#controls{margin-top:10px;display:grid;grid-template-columns:60px 60px 60px;gap:5px}
#controls button{width:60px;height:60px;font-size:25px;background:#333;color:white;border:2px solid white;border-radius:10px}
</style>
</head>
<body>
<div id="top"><span>Время:<b id="tm">30</b></span><span>Очки:<b id="sc">0</b>/300</span></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="controls">
<div></div><button onclick="dir(0,-1)">↑</button><div></div>
<button onclick="dir(-1,0)">←</button><button onclick="dir(0,1)">↓</button><button onclick="dir(1,0)">→</button>
</div>

<div id="start">
<h1>🐍 ЗМЕЙКА</h1>
<p>Набери 300 очков за 30 секунд!</p>
<button id="play">PLAY</button>
<h2 id="msg"></h2>
</div>

<script>
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let scEl=document.getElementById('sc'),tmEl=document.getElementById('tm');
let start=document.getElementById('start'),msg=document.getElementById('msg');
let snake,food,dx,dy,score,time,loop,timer;
let grid=18,size=20;

function init(){
 snake=[{x:9,y:9}];food={x:5,y:5};dx=1;dy=0;score=0;time=30;
 scEl.textContent=0;tmEl.textContent=30;
}
function randFood(){food={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)};}
function draw(){
 ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,360,360);
 ctx.fillStyle='red';ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
 ctx.fillStyle='lime';snake.forEach(s=>{ctx.fillRect(s.x*size,s.y*size,size-2,size-2);});
}
function move(){
 let head={x:snake[0].x+dx,y:snake[0].y+dy};
 if(head.x<0)head.x=grid-1;if(head.x>=grid)head.x=0;
 if(head.y<0)head.y=grid-1;if(head.y>=grid)head.y=0;
 if(snake.some(s=>s.x==head.x&&s.y==head.y)){end();return;}
 snake.unshift(head);
 if(head.x==food.x&&head.y==food.y){score+=20;scEl.textContent=score;randFood();}
 else{snake.pop();}
 draw();
}
function dir(x,y){if(dx==-x&&dy==-y)return;dx=x;dy=y;}

document.getElementById('play').onclick=()=>{
 init();randFood();draw();start.style.display='none';
 loop=setInterval(move,90);
 timer=setInterval(()=>{time--;tmEl.textContent=time;if(time<=0)end();},1000);
};

function end(){
 clearInterval(loop);clearInterval(timer);
 start.style.display='flex';
 if(score>=300){msg.innerHTML='МОЛОДЕЦ ТЫ СПРАВИЛСЯ! 🎉<br>'+score+' очков!';document.getElementById('play').textContent='ЕЩЕ РАЗ';}
 else{msg.textContent='Проиграл: '+score+'/300';document.getElementById('play').textContent='СНОВА';}
}
document.addEventListener('keydown',e=>{
 if(e.key=='ArrowUp')dir(0,-1);
 if(e.key=='ArrowDown')dir(0,1);
 if(e.key=='ArrowLeft')dir(-1,0);
 if(e.key=='ArrowRight')dir(1,0);
});
</script>
</body>
</html>
