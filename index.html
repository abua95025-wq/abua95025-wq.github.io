<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛАБИРИНТ</title>
<style>
body{margin:0;background:#222;overflow:hidden;touch-action:none}
canvas{width:100vw;height:100vh;display:block;background:#a0c0ff}
#b{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:10px}
.k{width:65px;height:65px;background:#fff;border:3px solid #000;border-radius:15px;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none}
.k:active{background:yellow}
#top{position:fixed;top:0;left:0;right:0;background:#000;color:#ff0;padding:8px;text-align:center;font:900 16px Arial}
</style></head><body>
<div id="top">Собери 3 ЖЕЛТЫХ квадрата! Красный - враг</div>
<div id="b"><div class="k" id="l">◀</div><div style="display:flex;flex-direction:column;gap:10px"><div class="k" id="u">▲</div><div class="k" id="d">▼</div></div><div class="k" id="r">▶</div></div>
<canvas id="c"></canvas>
<script>
let cv=document.getElementById('c'), x=cv.getContext('2d'), W=innerWidth, H=innerHeight;
cv.width=W; cv.height=H;
let px=50, py=50, mx=400, my=300, keys={}, score=0;
let walls=[[0,0,1000,20],[0,0,20,1000],[0,500,600,20],[200,0,20,400],[400,100,20,400],[600,0,20,500]];
let coins=[[200,200],[500,100],[300,400]];

function draw(){
 x.fillStyle='#a0c0ff'; x.fillRect(0,0,W,H);

 x.fillStyle='#333'; walls.forEach(w=>x.fillRect(w[0],w[1],w[2],w[3]));

 x.fillStyle='yellow'; coins.forEach(c=>{x.fillRect(c[0],c[1],20,20); x.fillStyle='black'; x.fillRect(c[0]+8,c[1]+5,4,10); x.fillStyle='yellow';});
 
 x.fillStyle='red'; x.fillRect(mx,my,25,25);
 /
 x.fillStyle='lime'; x.fillRect(px,py,22,22);
}

function coll(ax,ay){
 for(let w of walls){ if(ax<w[0]+w[2] && ax+22>w[0] && ay<w[1]+w[3] && ay+22>w[1]) return true; }
 return false;
}

setInterval(()=>{
 let dx=0, dy=0; if(keys.u)dy=-5; if(keys.d)dy=5; if(keys.l)dx=-5; if(keys.r)dx=5;
 if(!coll(px+dx,py)) px+=dx; if(!coll(px,py+dy)) py+=dy;

 let mdx=(px>mx?1:-1)*0.8, mdy=(py>my?1:-1)*0.8;
 if(!coll(mx+mdx,my)) mx+=mdx; if(!coll(mx,my+mdy)) my+=mdy;

 coins=coins.filter(c=>{ if(Math.abs(c[0]-px)<22 && Math.abs(c[1]-py)<22){score++; document.getElementById('top').innerText='СОБРАЛ '+score+'/3'; return false;} return true; });
 if(score==3){alert('ПОБЕДА! ТЫ СБЕЖАЛ!'); location.reload();}
 if(Math.abs(mx-px)<20 && Math.abs(my-py)<20){alert('ПОЙМАЛИ!'); location.reload();}
 draw();
},16);

function bind(id,k){let e=document.getElementById(id); e.ontouchstart=(ev)=>{ev.preventDefault(); keys[k]=1;}; e.ontouchend=()=>keys[k]=0; e.onmousedown=()=>keys[k]=1; e.onmouseup=()=>keys[k]=0; e.onmouseleave=()=>keys[k]=0;}
bind('u','u'); bind('d','d'); bind('l','l'); bind('r','r');
draw();
</script></body></html>
