<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ЗМЕЙКА</title>
<style>
body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px}
#top{display:flex;gap:20px;justify-content:center;align-items:center;font-size:18px;font-weight:bold;margin-bottom:10px}
#top span{background:#1a1a1a;padding:8px 14px;border-radius:20px;border:1px solid #333}
canvas{background:#1e1e4a;border:4px solid #fff;border-radius:16px;box-shadow:0 0 30px #ffffff30}
#start{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center}
#levels{display:flex;gap:10px;margin:15px}
#levels button{padding:12px 18px;border:2px solid #fff;background:#222;color:#fff;border-radius:12px;font-weight:bold;font-size:15px}
#levels button.active{background:lime;color:#000;transform:scale(1.1)}
#play{padding:16px 70px;font-size:22px;background:lime;border:0;border-radius:30px;font-weight:bold;margin-top:15px;cursor:pointer}
#msg{margin-top:15px;font-size:20px}
</style>
</head>
<body>

<div id="top">
<span>⏱️ <b id="tm">30</b></span>
<span>⭐ <b id="sc">0</b>/300</span>
<span>🏆 <b id="rec">0</b></span>
</div>

<canvas id="c" width="500" height="500"></canvas>

<div id="start">
<h1 style="font-size:40px;margin:0">🐍 ЗМЕЙКА</h1>
<p style="margin:10px 0;color:#aaa"><b>ВЫБЕРИ СКОРОСТЬ:</b></p>
<div id="levels">
<button id="b1" class="active" onclick="setLevel(1)">ЛЕГКАЯ</button>
<button id="b2" onclick="setLevel(2)">СРЕДНЯЯ</button>
<button id="b3" onclick="setLevel(3)">ЭКСТРИМ</button>
</div>
<p>Набери 300 за 30 сек!</p>
<p>Рекорд: <b id="rec2">0</b></p>
<button id="play" onclick="startGame()">PLAY</button>
<h2 id="msg"></h2>
<p style="color:#666;margin-top:20px;font-size:13px">Управление: WASD / Стрелки / Свайп на телефоне</p>
</div>

<script>
let c=document.getElementById('c'),ctx=c.getContext('2d');
let sc=document.getElementById('sc'),tm=document.getElementById('tm'),rc=document.getElementById('rec'),rc2=document.getElementById('rec2');
let snake,food,dx,dy,score,time,loop,timer,level=1,speed=150;
let grid=20,size=25; // УВЕЛИЧИЛ КОРОБКУ И ЧЕРВЯ
let record=localStorage.getItem('snakeRec')||0; rc.innerText=record; rc2.innerText=record;

function setLevel(l){
 level=l;
 document.querySelectorAll('#levels button').forEach(b=>b.classList.remove('active'));
 document.getElementById('b'+l).classList.add('active');
}

function rf(){
 food={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)};
}

function startGame(){
 document.getElementById('start').style.display='none';
 document.getElementById('msg').innerText='';
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dx=1; dy=0; score=0; time=30;
 if(level==1)speed=150; if(level==2)speed=100; if(level==3)speed=60;
 rf(); sc.innerText=0; tm.innerText=30;
 clearInterval(loop); clearInterval(timer);
 loop=setInterval(draw, speed);
 timer=setInterval(()=>{
  time--; tm.innerText=time;
  if(time<=0) endGame();
 },1000);
}

function endGame(){
 clearInterval(loop); clearInterval(timer);
 document.getElementById('start').style.display='flex';
 document.getElementById('msg').innerText= score>=300? '🏆 ПОБЕДА!' : '💀 Время вышло! Очки: '+score;
 if(score>record){record=score; localStorage.setItem('snakeRec',record); rc.innerText=record; rc2.innerText=record;}
}

function draw(){
 let head={x:snake[0].x+dx,y:snake[0].y+dy};
 if(head.x<0)head.x=grid-1; if(head.x>=grid)head.x=0; if(head.y<0)head.y=grid-1; if(head.y>=grid)head.y=0;
 if(snake.some(s=>s.x==head.x&&s.y==head.y)){
  clearInterval(loop); clearInterval(timer);
  document.getElementById('start').style.display='flex';
  document.getElementById('msg').innerText='💀 Съел себя! Очки: '+score;
  if(score>record){record=score; localStorage.setItem('snakeRec',record); rc.innerText=record; rc2.innerText=record;}
  return;
 }
 snake.unshift(head);
 if(head.x==food.x&&head.y==food.y){
  score+=10; sc.innerText=score;
  if(score>=300){ endGame(); return; }
  rf();
 } else snake.pop();

 // РИСУЕМ - ВСЕ УВЕЛИЧЕНО
 ctx.fillStyle='#1e1e4a'; ctx.fillRect(0,0,500,500);

 // ЕДА - БОЛЬШАЯ
 ctx.fillStyle='#ffcc00';
 ctx.fillRect(food.x*size+2, food.y*size+2, size-4, size-4);
 ctx.fillStyle='#ff3300';
 ctx.fillRect(food.x*size+6, food.y*size+6, size-12, size-12);

 // ЧЕРВЬ - ТОЛСТЫЙ
 snake.forEach((s,i)=>{
  if(i==0){
   ctx.fillStyle='#7fff7f';
   ctx.fillRect(s.x*size+1, s.y*size+1, size-2, size-2);
   ctx.fillStyle='#fff';
   ctx.fillRect(s.x*size+18, s.y*size+5, 4, 4);
   ctx.fillRect(s.x*size+18, s.y*size+15, 4, 4);
  } else {
   ctx.fillStyle='#3aff3a';
   ctx.fillRect(s.x*size+2, s.y*size+2, size-4, size-4);
  }
 });
}

document.addEventListener('keydown',e=>{
 if(e.key=='ArrowUp'||e.key=='w'||e.key=='W') if(dy==0){dx=0;dy=-1}
 if(e.key=='ArrowDown'||e.key=='s'||e.key=='S') if(dy==0){dx=0;dy=1}
 if(e.key=='ArrowLeft'||e.key=='a'||e.key=='A') if(dx==0){dx=-1;dy=0}
 if(e.key=='ArrowRight'||e.key=='d'||e.key=='D') if(dx==0){dx=1;dy=0}
});

let sx,sy;
c.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; });
c.addEventListener('touchend',e=>{
 let dx2=e.changedTouches[0].clientX-sx, dy2=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx2)>Math.abs(dy2)){
  if(dx2>0 && dx!= -1){dx=1;dy=0} else if(dx2<0 && dx!=1){dx=-1;dy=0}
 } else {
  if(dy2>0 && dy!= -1){dx=0;dy=1} else if(dy2<0 && dy!=1){dx=0;dy=-1}
 }
});
</script>
</body>
</html>
