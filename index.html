<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Змейка</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
#top{display:flex;gap:12px;margin-bottom:8px}
canvas{background:#1a1a2e;border:3px solid #fff;border-radius:10px}
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99}
#levels{display:flex;gap:8px;margin:12px}
#levels button{padding:10px 12px;border:2px solid #fff;background:#333;color:#fff;border-radius:10px}
#levels button.active{background:lime;color:#000}
#play{padding:15px 50px;font-size:28px;background:lime;border:0;border-radius:30px;font-weight:bold}
</style></head><body>
<div id="top"><span>⏱<b id="tm">30</b></span><span>⭐<b id="sc">0</b>/300</span><span>🏆<b id="rec">0</b></span><span id="ls">🟢 Легкий</span></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="start">
<h1>🐍 ЗМЕЙКА</h1>
<p>ВЫБЕРИ СКОРОСТЬ:</p>
<div id="levels">
<button id="b1" class="active" onclick="setLevel(1)">ЛЕГКАЯ</button>
<button id="b2" onclick="setLevel(2)">СРЕДНЯЯ</button>
<button id="b3" onclick="setLevel(3)">ЭКСТРИМ</button>
</div>
<p>Набери 300 за 30 сек</p>
<p>Рекорд: <b id="rec2">0</b></p>
<button id="play">PLAY</button>
<h2 id="msg"></h2>
</div>
<script>
let c=document.getElementById('c'),ctx=c.getContext('2d'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),re=document.getElementById('rec'),re2=document.getElementById('rec2'),st=document.getElementById('start'),mg=document.getElementById('msg'),ls=document.getElementById('ls');
let snake,food,dx,dy,score,time,loop,timer,level=1,speed=150,grid=18,size=20;
let record=localStorage.getItem('r')?+localStorage.getItem('r'):0; re.textContent=record; re2.textContent=record;
function setLevel(l){level=l; document.querySelectorAll('#levels button').forEach(b=>b.classList.remove('active')); document.getElementById('b'+l).classList.add('active'); if(l==1){speed=150; ls.textContent='🟢 Легкий'} if(l==2){speed=90; ls.textContent='🟡 Средний'} if(l==3){speed=45; ls.textContent='🔴 Экстрим'}}
function init(){snake=[{x:9,y:9}];food={x:5,y:5};dx=1;dy=0;score=0;time=30; sc.textContent=0; tm.textContent=30;}
function rf(){food={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)}}
function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,360,360); ctx.fillStyle='red';ctx.fillRect(food.x*size,food.y*size,size-2,size-2); ctx.fillStyle='lime';snake.forEach(s=>ctx.fillRect(s.x*size,s.y*size,size-2,size-2))}
function mv(){let h={x:snake[0].x+dx,y:snake[0].y+dy}; if(h.x<0)h.x=17;if(h.x>17)h.x=0;if(h.y<0)h.y=17;if(h.y>17)h.y=0; if(snake.some(s=>s.x==h.x&&s.y==h.y))return end(); snake.unshift(h); if(h.x==food.x&&h.y==food.y){score+=20;sc.textContent=score;rf()}else snake.pop(); draw()}
function dir(x,y){if(dx==-x&&dy==-y)return;dx=x;dy=y;}
document.getElementById('play').onclick=()=>{init();rf();draw();st.style.display='none'; loop=setInterval(mv,speed); timer=setInterval(()=>{time--;tm.textContent=time; if(time<=0)end()},1000)}
function end(){clearInterval(loop);clearInterval(timer); st.style.display='flex'; if(score>record){record=score; localStorage.setItem('r',record); re.textContent=record; re2.textContent=record;} if(score>=300){mg.innerHTML='МОЛОДЕЦ ТЫ СПРАВИЛСЯ! 🎉<br>'+score+'<br>'+(score==record?'🏆 НОВЫЙ РЕКОРД!':'')}else mg.innerHTML='Проиграл: '+score+'/300'}
document.addEventListener('keydown',e=>{if(e.key=='ArrowUp')dir(0,-1); if(e.key=='ArrowDown')dir(0,1); if(e.key=='ArrowLeft')dir(-1,0); if(e.key=='ArrowRight')dir(1,0)});
setLevel(1);
</script></body></html>
