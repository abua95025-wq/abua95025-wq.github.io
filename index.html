<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЗМЕЙКА PRO</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
#top{width:100%;max-width:720px;background:#111;display:flex;justify-content:space-around;padding:16px 0;border-bottom:4px solid #0f0;position:sticky;top:0;z-index:5}
#top span{font-size:18px} #top b{color:gold;font-size:30px;margin-left:6px}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.row button{padding:12px 18px;border-radius:14px;border:3px solid #fff;background:#222;color:#fff;font-weight:bold;font-size:14px}
.row button.on{background:lime;color:#000;border-color:lime}
canvas{background:#1e1e8a;border:6px solid #fff;border-radius:20px;width:620px;height:620px;max-width:95vw;max-height:95vw;touch-action:none}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
#overlay h1{font-size:48px;margin:0} #overlay button{margin-top:20px;padding:18px 80px;font-size:28px;background:lime;border:0;border-radius:40px;font-weight:bold}
#ctrl{margin-top:14px;display:grid;grid-template-columns:70px 70px 70px;gap:10px}
#ctrl button{width:70px;height:70px;border-radius:16px;border:2px solid #555;background:#222;color:#fff;font-size:28px}
</style>
</head><body>

<div id="top"><span>⏱️<b id="tm">30</b></span><span>⭐<b id="sc">0</b></span><span>🏆<b id="rc">0</b></span></div>

<div class="row">
<button id="l1" class="on" onclick="setL(1)">🟢 ЛЕГКАЯ</button>
<button id="l2" onclick="setL(2)">🔵 СРЕДНЯЯ</button>
<button id="l3" onclick="setL(3)">🔴 ЭКСТРИМ</button>
</div>

<div class="row">
<button id="s1" class="on" onclick="setS(150,1)">🐢 150</button>
<button id="s2" onclick="setS(90,2)">⚡ 90</button>
<button id="s3" onclick="setS(50,3)">🔥 50</button>
<button id="s4" onclick="setS(90,4)">⏱️ 30сек / 300 очков</button>
</div>

<canvas id="c" width="600" height="600"></canvas>

<div id="ctrl"><div></div><button onclick="dir(0,-1)">↑</button><div></div><button onclick="dir(-1,0)">←</button><button onclick="dir(0,1)">↓</button><button onclick="dir(1,0)">→</button></div>

<div id="overlay">
<h1>🐍 ЗМЕЙКА</h1>
<p style="font-size:18px">Цель: 300 очков за 30 сек</p>
<p>Рекорд: <b id="rc2" style="color:gold;font-size:32px">0</b></p>
<button onclick="play()">▶ PLAY</button>
<h2 id="msg" style="color:lime;margin-top:15px"></h2>
</div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const tmE=document.getElementById('tm'),scE=document.getElementById('sc'),rcE=document.getElementById('rc'),rc2E=document.getElementById('rc2'),ov=document.getElementById('overlay'),msgE=document.getElementById('msg');
let snake,food,dx,dy,score,time,level=1,speed=150,is30=true,loop,tick;
let record=localStorage.getItem('snakeFinalRec')||0; rcE.textContent=record; rc2E.textContent=record;
function setL(l){level=l;document.querySelectorAll('[id^=l]').forEach(b=>b.classList.remove('on'));document.getElementById('l'+l).classList.add('on');}
function setS(s,n){speed=s;is30=(n==4);document.querySelectorAll('[id^=s]').forEach(b=>b.classList.remove('on'));document.getElementById('s'+n).classList.add('on');}
function dir(x,y){if(!dx&&!dy)return; if(x!==0&&dx===-x)return; if(y!==0&&dy===-y)return; dx=x; dy=y;}
function newFood(){do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(snake.some(p=>p.x===food.x&&p.y===food.y));}
function play(){
  ov.style.display='none'; snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dx=1; dy=0; score=0; time=is30?30:999; tmE.textContent=is30?30:'∞'; scE.textContent=0; newFood();
  clearInterval(loop);clearInterval(tick);
  let sp=is30?speed:(level===1?150:level===2?90:50);
  loop=setInterval(draw,sp);
  if(is30){tick=setInterval(()=>{time--; tmE.textContent=time; if(time<=0) gameOver('Время вышло! Очков: '+score);},1000);}
}
function gameOver(txt){
  clearInterval(loop);clearInterval(tick); ov.style.display='flex'; msgE.textContent=txt;
  if(score>record){record=score; localStorage.setItem('snakeFinalRec',record); rcE.textContent=record; rc2E.textContent=record;}
}
function draw(){
  let head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0)head.x=19; if(head.x>19)head.x=0; if(head.y<0)head.y=19; if(head.y>19)head.y=0;
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver('💀 Съел себя! Очков: '+score);return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=10+level*2; scE.textContent=score; if(is30&&score>=300){gameOver('🏆 ПОБЕДА! 300 очков!');return;} newFood();}
  else snake.pop();
  X.fillStyle='#1e1e8a'; X.fillRect(0,0,600,600);
  X.strokeStyle='#2c2cb0'; X.lineWidth=1; for(let i=0;i<=20;i++){X.beginPath();X.moveTo(i*30,0);X.lineTo(i*30,600);X.stroke();X.beginPath();X.moveTo(0,i*30);X.lineTo(600,i*30);X.stroke();}
  X.fillStyle='yellow'; X.fillRect(food.x*30+2,food.y*30+2,26,26);
  X.fillStyle='red'; X.fillRect(food.x*30+9,food.y*30+9,12,12);
  snake.forEach((p,i)=>{X.fillStyle=i===0?'#afffaa':'#00ff00'; X.fillRect(p.x*30+2,p.y*30+2,26,26); if(i===0){X.fillStyle='black'; X.fillRect(p.x*30+8,p.y*30+8,5,5); X.fillRect(p.x*30+18,p.y*30+8,5,5);}});
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')dir(0,-1);if(e.key==='ArrowDown'||e.key==='s')dir(0,1);if(e.key==='ArrowLeft'||e.key==='a')dir(-1,0);if(e.key==='ArrowRight'||e.key==='d')dir(1,0);});
let sx=0,sy=0; C.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:false});
C.addEventListener('touchend',e=>{let ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY,dx2=ex-sx,dy2=ey-sy; if(Math.abs(dx2)>Math.abs(dy2)){if(dx2>0)dir(1,0);else dir(-1,0);}else{if(dy2>0)dir(0,1);else dir(0,-1);}},{passive:false});
// начальный фон
X.fillStyle='#1e1e8a';X.fillRect(0,0,600,600);
</script></body></html>
