<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>M5 F90 City Drive</title>
<style>body{margin:0;background:#111;overflow:hidden;font-family:Arial Black}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;z-index:2;text-shadow:0 2px 4px #000}#pedals{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:15px;z-index:3}.btn{width:85px;height:85px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid #fff;color:#fff;font:900 14px Arial;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}#gas{background:rgba(46,204,113,.5)}#brake{background:rgba(231,76,60,.5)}</style>
</head>
<body>
<div id="ui"><span id="speed">0 KM/H</span><span>M5 F90</span></div>
<canvas id="c"></canvas>
<div id="pedals">
<div style="display:flex;gap:12px"><div class="btn" id="left">◀ ЛЕВО</div><div class="btn" id="right">ПРАВО ▶</div></div>
<div style="display:flex;gap:12px"><div class="btn" id="brake">ТОРМОЗ</div><div class="btn" id="gas">ГАЗ</div></div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d'); let W,H; function R(){W=innerWidth;H=innerHeight;cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(2,0,0,2,0,0)}R(); onresize=R;
let car={x:0,y:0,ang:-Math.PI/2, speed:0, max:9, steer:0};
let keys={gas:0,brake:0,left:0,right:0};
let city=[];
for(let i=0;i<60;i++) city.push({x:(Math.random()-0.5)*3000, y:(Math.random()-0.5)*3000, w:80+Math.random()*120, h:80+Math.random()*120});

function update(){
 if(keys.gas) car.speed+=0.18; else if(keys.brake) car.speed-=0.28; else car.speed*=0.985;
 car.speed=Math.max(-3, Math.min(car.max, car.speed));
 if(Math.abs(car.speed)>0.3){
  if(keys.left) car.steer-=0.04; else if(keys.right) car.steer+=0.04; else car.steer*=0.85;
  car.steer=Math.max(-0.08, Math.min(0.08, car.steer));
  car.ang+=car.steer * (car.speed/4);
 }
 car.x+=Math.cos(car.ang)*car.speed;
 car.y+=Math.sin(car.ang)*car.speed;
 document.getElementById('speed').innerText=Math.abs(Math.floor(car.speed*22))+' KM/H';
}
function draw(){
 ctx.fillStyle='#2c3e50'; ctx.fillRect(0,0,W,H);
 ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(-car.ang+Math.PI/2); ctx.translate(-car.x,-car.y);
 // дороги сетка
 ctx.strokeStyle='#34495e'; ctx.lineWidth=2; for(let i=-3000;i<=3000;i+=200){ ctx.beginPath(); ctx.moveTo(i,-3000); ctx.lineTo(i,3000); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-3000,i); ctx.lineTo(3000,i); ctx.stroke(); }
 // дома
 city.forEach(b=>{
  // коллизия с домом - простой отталкивание
  if(Math.abs(car.x-b.x)<b.w/2+22 && Math.abs(car.y-b.y)<b.h/2+22){ car.speed*=-0.4; }
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
  ctx.fillStyle='#2c2c2c'; ctx.fillRect(b.x-b.w/2+6, b.y-b.h/2+6, b.w-12, b.h-12);
  ctx.fillStyle='#f1c40f'; for(let i=0;i<3;i++) for(let j=0;j<2;j++) ctx.fillRect(b.x-b.w/2+12+i*18, b.y-b.h/2+12+j*18, 6,6);
 });
 // машина M5 F90 вид сверху
 ctx.save(); ctx.translate(car.x,car.y); ctx.rotate(car.ang);
 ctx.fillStyle='#000'; ctx.fillRect(-14,-24,28,48); // тень
 ctx.fillStyle='#0a3d8f'; ctx.fillRect(-13,-26,26,46); // кузов синий M5
 ctx.fillStyle='#111'; ctx.fillRect(-13,-26,26,6); ctx.fillRect(-13,18,26,8); // бамперы
 ctx.fillStyle='#87ceeb'; ctx.fillRect(-11,-12,22,18); // стекло
 ctx.fillStyle='#222'; ctx.fillRect(-15,-20,4,8); ctx.fillRect(11,-20,4,8); ctx.fillRect(-15,10,4,8); ctx.fillRect(11,10,4,8); // колеса
 ctx.fillStyle='#ffeb3b'; ctx.fillRect(-10,-27,4,3); ctx.fillRect(6,-27,4,3); // фары
 ctx.restore();
 ctx.restore();
 // мини машина по центру для красоты
 ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(W/2,H/2+22,18,8,0,0,7); ctx.fill();
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
function bind(id,k){ const el=document.getElementById(id); const s=e=>{e.preventDefault();keys[k]=1}; const e=e=>{keys[k]=0}; el.addEventListener('touchstart',s,{passive:false}); el.addEventListener('touchend',e); el.addEventListener('mousedown',s); el.addEventListener('mouseup',e); el.addEventListener('mouseleave',e); }
bind('gas','gas'); bind('brake','brake'); bind('left','left'); bind('right','right');
addEventListener('keydown',e=>{ if(e.key=='ArrowUp'||e.key=='w') keys.gas=1; if(e.key=='ArrowDown'||e.key=='s') keys.brake=1; if(e.key=='ArrowLeft'||e.key=='a') keys.left=1; if(e.key=='ArrowRight'||e.key=='d') keys.right=1; });
addEventListener('keyup',e=>{ if(e.key=='ArrowUp'||e.key=='w') keys.gas=0; if(e.key=='ArrowDown'||e.key=='s') keys.brake=0; if(e.key=='ArrowLeft'||e.key=='a') keys.left=0; if(e.key=='ArrowRight'||e.key=='d') keys.right=0; });
</script>
</body>
</html>
