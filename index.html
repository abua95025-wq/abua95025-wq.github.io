<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DUSHANBE HUSTLE</title>
<style>html,body{margin:0;height:100%;background:#0a0e18;overflow:hidden;font-family:Arial Black}canvas{display:block;width:100vw;height:100vh}#ui{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;color:#fff;pointer-events:none;text-shadow:0 2px 6px #000}#tap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:20px;pointer-events:auto}#t{width:46%;height:72%;border-radius:24px;background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font:900 14px Arial}#over{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:10}#over button{padding:16px 44px;border-radius:30px;border:0;background:#ffcc00;font:900 18px Arial}</style>
</head>
<body>
<div id="ui"><div><div id="sc" style="font-size:32px">0</div><div style="font-size:10px;opacity:.6">САМСЫ • DUSHANBE HUSTLE</div></div><div style="text-align:right"><div id="sp" style="font-size:20px">0 KM/H</div><div style="font-size:10px;opacity:.6">СКУТЕР 50CC</div></div></div>
<div id="tap"><div id="t">◀ ЛЕВО</div><div id="t">ПРАВО ▶</div></div>
<div id="over"><h1 style="font-size:48px;margin:0;color:#ffcc00">УПАЛ!</h1><p id="fr"></p><button onclick="location.reload()">ЕЩЕ ДОСТАВКУ</button></div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d');let W,H;function R(){W=innerWidth;H=innerHeight;cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';X.setTransform(2,0,0,2,0,0)}R();onresize=R;
let lane=1, x=W/2, y=H*0.75, target=1, speed=5, score=0, objs=[], run=true, shake=0;
let lanes=[W*0.25,W*0.5,W*0.75];
function add(){let l=Math.floor(Math.random()*3);let r=Math.random(); if(r<0.55) objs.push({t:'car',l,z:-200,w:1}); else if(r<0.8) objs.push({t:'samsa',l,z:-200}); else objs.push({t:'dog',l,z:-200});}
let tm=0;
function upd(){
 if(!run) return; tm+=speed; if(tm>90){tm=0; add(); if(Math.random()<0.5) add();}
 x+=(lanes[target]-x)*0.18; speed+=0.004; if(speed>14) speed=14;
 objs.forEach(o=>o.z+=speed); objs=objs.filter(o=>o.z<H+100);
 for(let o of objs){ if(o.z< y-70 || o.z> y+20) continue; if(o.l!=target) continue;
  if(o.t=='samsa'){o.z=9999; score++; sc.innerText=score; shake=6;}
  else {run=false; over.style.display='flex'; fr.innerText=`Доставил ${score} самс | ${Math.floor(speed*18)} км/ч`; return;}
 }
 sp.innerText=Math.floor(speed*11)+' KM/H';
 if(shake>0) shake--;
}
function draw(){
 X.fillStyle='#1a2a3a'; X.fillRect(0,0,W,H);
 if(shake) X.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

 X.fillStyle='#2a3a4a'; X.fillRect(0,H*0.15,W,H);
 X.fillStyle='#ffcc00'; for(let i=0;i<H;i+=30){X.fillRect(W*0.33-2, H*0.15 + (i+tm*2)%H, 4,14); X.fillRect(W*0.66-2, H*0.15 + (i+tm*2)%H, 4,14);}

 objs.sort((a,b)=>a.z-b.z).forEach(o=>{
  if(o.z<-50) return; let p=o.z/H, sc=Math.max(0.2,p*1.1), Xp=W*0.5+(lanes[o.l]-W*0.5)*(0.2+p*0.8);
  X.save(); X.translate(Xp,o.z); X.scale(sc,sc);
  if(o.t=='samsa'){X.fillStyle='#ffcc00'; X.beginPath(); X.arc(0,0,16,0,7); X.fill(); X.fillStyle='#8d5524'; X.fillRect(-8,-3,16,6); X.fillStyle='#fff'; X.font='bold 12px Arial'; X.fillText('☀',-6,4);}
  else if(o.t=='car'){X.fillStyle=o.l==1?'#e74c3c':'#3498db'; X.fillRect(-26,-40,52,72); X.fillStyle='#111'; X.fillRect(-22,-35,44,18); X.fillStyle='#87ceeb'; X.fillRect(-20,-30,40,10);}
  else if(o.t=='dog'){X.fillStyle='#8d5524'; X.fillRect(-12,-12,24,24); X.beginPath(); X.arc(0,-18,10,0,7); X.fill();}
  X.restore();
 });
 
 X.fillStyle='rgba(0,0,0,.25)'; X.beginPath(); X.ellipse(x,y+18,18,6,0,0,7); X.fill();
 X.save(); X.translate(x,y); X.fillStyle='#ffcc00'; X.fillRect(-10,-22,20,14); X.fillStyle='#111'; X.fillRect(-14,0,28,6); X.fillStyle='#fff'; X.beginPath(); X.arc(0,-26,12,0,7); X.fill(); X.fillStyle='#111'; X.fillRect(-12,-34,24,6); X.restore();
 if(shake) X.setTransform(2,0,0,2,0,0);
}
(function L(){upd();draw();requestAnimationFrame(L)})();
function go(d){if(d<0&&target>0)target--; if(d>0&&target<2)target++;}
addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key=='a')go(-1);if(e.key=='ArrowRight'||e.key=='d')go(1);});
let sx=0; addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:false});
addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)<10){go(e.changedTouches[0].clientX<W/2?-1:1);}else{if(dx<-20)go(-1);else if(dx>20)go(1); }},{passive:false});
document.querySelectorAll('#t').forEach((el,i)=>{el.addEventListener('touchstart',e=>{e.preventDefault();go(i==0?-1:1)},{passive:false})});
</script>
</body>
</html>
