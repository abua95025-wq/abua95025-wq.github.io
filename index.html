<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL ESCAPE</title>
<style>
body{background:#0d1117;color:#00ff00;font-family:monospace;padding:15px}
#game{border:1px solid #00ff00;padding:15px;max-width:600px;margin:auto}
button{background:#00ff00;color:#000;border:none;padding:8px;margin:3px;font-weight:bold}
input{background:#000;color:#0f0;border:1px solid #0f0;padding:5px;width:70%}
</style>
</head>
<body>
<div id="game">
<h1>DIGITAL ESCAPE</h1>
<div id="text"></div>
<input id="cmd" placeholder="пиши тут...">
<button onclick="go()">ENTER</button><br><br>
<button onclick="setCmd('осмотреться')">осмотреться</button>
<button onclick="setCmd('перейти')">перейти</button>
<button onclick="setCmd('инвентарь')">инвентарь</button>
<button onclick="setCmd('помощь')">помощь</button>
</div>
<script>
let lives=3,inv=[],cur="комната управления",name="",wait="name",waitNext=false;
let rooms={
"комната управления":{d:"На столе лежит карта.",item:"карта",next:["серверная"]},
"серверная":{d:"Тут загадка 15+27=?",item:"ключ",next:["лаборатория"],need:"карта"},
"лаборатория":{d:"Загадка: напиши 'выход' наоборот",item:"код выхода",next:["главная дверь"],need:"ключ"},
"главная дверь":{d:"Финал",item:null,next:[],need:"код выхода"}
};
let t=document.getElementById("text"), c=document.getElementById("cmd");
function log(s){t.innerHTML+=s+"<br>"}
function enter(){log("<br>--- "+cur.toUpperCase()+" ---"); log(rooms[cur].d); log("Жизни:"+lives+" | Инвентарь:"+(inv.join(",")||"пусто")); log("Команды: осмотреться, перейти, инвентарь, помощь");}
log("Привет! Как тебя зовут?");
function setCmd(v){c.value=v; go();}
function go(){
let v=c.value.trim().toLowerCase(); c.value=""; if(!v)return;
if(wait=="name"){name=v||"Игрок"; wait=""; log("Привет, "+name+"!"); enter(); return;}
if(wait=="math"){if(v=="42"){log("Правильно! Нашел ключ!"); inv.push("ключ"); cur="серверная"; wait="";} else{lives--; log("Неправильно! Жизней:"+lives);} if(lives>0)enter(); else log("Игра окончена"); return;}
if(wait=="word"){if(v=="дохыв"){log("Правильно! Нашел код выхода!"); inv.push("код выхода"); cur="лаборатория"; wait="";} else{lives--; log("Неправильно! Жизней:"+lives);} if(lives>0)enter(); else log("Игра окончена"); return;}
if(waitNext){waitNext=false;
 if(!rooms[cur].next.includes(v)){log("Туда нельзя!"); enter(); return;}
 let need=rooms[v].need; if(need&&!inv.includes(need)){log("Нужен: "+need); lives--; log("Жизней:"+lives); enter(); return;}
 if(v=="серверная"){log("Реши: 15+27=?"); wait="math"; return;}
 if(v=="лаборатория"){log("Напиши 'выход' наоборот"); wait="word"; return;}
 if(v=="главная дверь"){log("ПОБЕДА!!! Ты сбежал, "+name+"! Жизней осталось: "+lives); return;}
 cur=v; enter(); return;
}
if(v=="осмотреться"){let it=rooms[cur].item; if(it&&!inv.includes(it)){inv.push(it); log("Нашел: "+it);} else log("Тут пусто");}
else if(v=="инвентарь"){log("У тебя: "+(inv.join(",")||"пусто"));}
else if(v=="помощь"){log("Нужно: карта -> ключ -> код выхода -> главная дверь");}
else if(v=="перейти"){log("Куда можно: "+rooms[cur].next.join(", ")); log("Напиши куда:"); waitNext=true;}
else log("Команда не понятна. Жми кнопки ниже.");
}
</script>
</body>
</html>
