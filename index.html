<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1">
<title>ЗМЕЙКА</title><style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center}
#top{width:100%;max-width:700px;display:flex;justify-content:space-around;background:#111;padding:14px 0;border-bottom:3px solid lime}
#top b{color:gold;font-size:28px}
#lv{display:flex;gap:10px;margin:10px}
#lv button{padding:10px 16px;border:2px solid #fff;background:#222;color:#fff;border-radius:12px;font-weight:bold}
#lv button.on{background:lime;color:#000}
canvas{background:#1e1e8a;border:5px solid #fff;border-radius:16px;width:600px;height:600px;max-width:95vw}
#start{position:fixed;inset:0;background:#000000ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
#start button{padding:18px 70px;font-size:28px;background:lime;border:0;border-radius:30px;font-weight:bold}
#ctrl{display:grid;grid-template-columns:70px 70px 70px;gap:10px;margin-top:10px}
#ctrl button{width:70px;height:70px;background:#222;color:#fff;border:2px solid #555;border-radius:15px;font-size:28px}
</style></head><body>
<div id=top><span>⏱️ <b id=t>30</b></span><span>⭐ <b id=s>0</b></span><span>🏆 <b id=r>0</b></span></div>
<div id=lv><button id=b1 class=on onclick="L(1)">🟢 ЛЕГКАЯ</button><button id=b2 onclick="L(2)">🔵 СРЕДНЯЯ</button><button id=b3 onclick="L(3)">🔴 ЭКСТРИМ</button></div>
<canvas id=c width=600 height=600></canvas>
<div id=ctrl><div></div><button onclick="D(0,-1)">↑</button><div></div><button onclick="D(-1,0)">←</button><button onclick="D(0,1)">↓</button><button onclick="D(1,0)">→</button></div>

<div id=start><h1>🐍 ЗМЕЙКА</h1><p>Собери 300 очков за 30 сек!</p><p>Рекорд: <b id=r2 style="color:gold;font-size:28px">0</b></p><button onclick="start()">▶ PLAY</button><h2 id=msg></h2></div>

<script>
let C=document.getElementById('c'),X=C.getContext('2d'),Tt=document.getElementById('t'),Ss=document.getElementById('s'),Rr=document.getElementById('r'),R2=document.getElementById('r2'),ST=document.getElementById('start'),MSG=document.getElementById('msg');
let sn,fd,dx,dy,sc,ti,lv=1,rec=localStorage.getItem('rec')||0,loop,tmr;
Rr.innerText=rec;R2.innerText=rec;
function L(l){lv=l;document.querySelectorAll('#lv button').forEach(b=>b.classList.remove('on'));document.getElementById('b'+l).classList.add('on')}
function D(x,y){if(dx!=-x||dy!=-y){dx=x;dy=y}}
function NF(){do{fd={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(sn&&sn.some(p=>p.x==fd.x&&p.y==fd.y))}
function start(){
ST.style.display='none';sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dx=1;dy=0;sc=0;ti=30;Ss.innerText=0;Tt.innerText=30;NF();
clearInterval(loop);clearInterval(tmr);
let sp=lv==1?150:lv==2?90:50;
loop=setInterval(draw,sp);
tmr=setInterval(()=>{ti--;Tt.innerText=ti;if(ti<=0){end('Время вышло! Очков: '+sc)}},1000);
}
function end(txt){clearInterval(loop);clearInterval(tmr);ST.style.display='flex';MSG.innerText=txt;if(sc>rec){rec=sc;localStorage.setItem('rec',rec);Rr.innerText=rec;R2.innerText=rec}}
function draw(){
let h={x:sn[0].x+dx,y:sn[0].y+dy};if(h.x<0)h.x=19;if(h.x>19)h.x=0;if(h.y<0)h.y=19;if(h.y>19)h.y=0;
if(sn.some(o=>o.x==h.x&&o.y==h.y)){end('Съел себя! '+sc);return}
sn.unshift(h);if(h.x==fd.x&&h.y==fd.y){sc+=10;Ss.innerText=sc;NF();if(sc>=300){end('ПОБЕДА! 300 очков!');return}}else sn.pop();
X.fillStyle='#1e1e8a';X.fillRect(0,0,600,600);
X.strokeStyle='#2a2ab0';for(let i=0;i<=20;i++){X.beginPath();X.moveTo(i*30,0);X.lineTo(i*30,600);X.stroke();X.beginPath();X.moveTo(0,i*30);X.lineTo(600,i*30);X.stroke();}
X.fillStyle='yellow';X.fillRect(fd.x*30+2,fd.y*30+2,26,26);X.fillStyle='red';X.fillRect(fd.x*30+9,fd.y*30+9,12,12);
sn.forEach((o,i)=>{X.fillStyle=i==0?'#aaffaa':'#00ff00';X.fillRect(o.x*30+2,o.y*30+2,26,26);if(i==0){X.fillStyle='#000';X.fillRect(o.x*30+8,o.y*30+8,5,5);X.fillRect(o.x*30+18,o.y*30+8,5,5)}})
}
document.addEventListener('keydown',e=>{if(e.key=='ArrowUp'&&dy==0)D(0,-1);if(e.key=='ArrowDown'&&dy==0)D(0,1);if(e.key=='ArrowLeft'&&dx==0)D(-1,0);if(e.key=='ArrowRight'&&dx==0)D(1,0)});
let sx,sy;C.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
C.addEventListener('touchend',e=>{let dx2=e.changedTouches[0].clientX-sx,dy2=e.changedTouches[0].clientY-sy;if(Math.abs(dx2)>Math.abs(dy2)){if(dx2>0&&dx!=-1)D(1,0);else if(dx!=1)D(-1,0)}else{if(dy2>0&&dy!=-1)D(0,1);else if(dy!=1)D(0,-1)}});
// рисуем пустое поле под стартовым экраном
X.fillStyle='#1e1e8a';X.fillRect(0,0,600,600);
</script></body></html>
