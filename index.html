<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAR JUMP - Mac Edition</title>
<style>
*{margin:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#e8f8ff;overflow:hidden;height:100vh}
#bar{display:flex;justify-content:space-between;background:#fff;padding:10px 15px;border-bottom:4px solid #00d4ff;font-weight:900;font-size:14px;align-items:center}
canvas{display:block;width:100%;height:75vh;background:linear-gradient(#fff,#b8f0ff)}
#help{text-align:center;padding:8px;background:#000;color:#0f0;font:700 13px monospace}
</style></head><body>
<div id="bar"><div>⭐ SCORE: <span id="sc">0</span></div><div>LEVEL 4 - STAR JUMP</div><div>❤️ <span id="lv">3</span></div></div>
<canvas id="c"></canvas>
<div id="help">MAC: ПРОБЕЛ / W / ⬆️ = ПРЫЖОК | A D / ⬅️➡️ = ВЛЕВО ВПРАВО | Нажми на игру 1 раз</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth*2; canvas.height=innerHeight*0.75*2; ctx.scale(2,2);} resize();

let player={x:100,y:300,w:40,h:40,vy:0,jumping:false};
let gravity=0.7, stars=[], spikes=[], score=0, lives=3, speed=3;
let keys={};

function spawn(){
 stars=[]; spikes=[];
 for(let i=0;i<7;i++) stars.push({x:200+i*180+Math.random()*100,y:100+Math.random()*200,taken:false});
 for(let i=0;i<4;i++) spikes.push({x:400+i*300,y:window.innerHeight*0.75-60,w:80,h:50});
}
spawn();

function update(){
 if(keys.ArrowLeft||keys.a) player.x-=5;
 if(keys.ArrowRight||keys.d) player.x+=5;
 player.vy+=gravity; player.y+=player.vy;
 let ground=window.innerHeight*0.75-80;
 if(player.y>ground){player.y=ground; player.vy=0; player.jumping=false;}
 if(player.x<0) player.x=0; if(player.x>window.innerWidth-50) player.x=window.innerWidth-50;

 stars.forEach(s=>{if(!s.taken && Math.abs(s.x-player.x)<35 && Math.abs(s.y-player.y)<35){s.taken=true; score++; document.getElementById('sc').innerText=score; if(score>=10){alert('ТЫ ВЫИГРАЛ! SCORE:'+score); location.reload();}}});
 spikes.forEach(sp=>{
  sp.x-=speed;
  if(sp.x<-100) sp.x=window.innerWidth+Math.random()*300;
  if(player.x+player.w>sp.x && player.x<sp.x+sp.w && player.y+player.h>sp.y){
   lives--; document.getElementById('lv').innerText=lives; player.x=100; player.y=ground;
   if(lives<=0){alert('GAME OVER! Score: '+score); location.reload();}
  }
 });
}

function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);

 ctx.strokeStyle='#d0f0ff'; ctx.lineWidth=1;
 for(let i=0;i<20;i++){ctx.beginPath(); ctx.moveTo(0,i*30); ctx.lineTo(innerWidth,i*30); ctx.stroke();}

 ctx.fillStyle='#7ee8ff'; ctx.fillRect(0,window.innerHeight*0.75-30,innerWidth,30);
 ctx.strokeStyle='#ff8af0'; ctx.strokeRect(0,window.innerHeight*0.75-30,innerWidth,30);

 stars.forEach(s=>{if(s.taken) return; ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.arc(s.x,s.y,14,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText('⭐',s.x-8,s.y+5);});

 spikes.forEach(sp=>{ctx.fillStyle='#ff3a3a'; ctx.beginPath(); ctx.moveTo(sp.x,sp.y+sp.h); ctx.lineTo(sp.x+sp.w/2,sp.y); ctx.lineTo(sp.x+sp.w,sp.y+sp.h); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#a00'; ctx.stroke();});

 ctx.fillStyle='#7ed957'; ctx.fillRect(player.x,player.y,player.w,player.h); ctx.fillStyle='#000'; ctx.font='24px Arial'; ctx.fillText('😊',player.x+4,player.y+28);
}

function loop(){update(); draw(); requestAnimationFrame(loop);} loop();

window.addEventListener('keydown',e=>{
 keys[e.key]=1; keys[e.key.toLowerCase()]=1;
 if(e.code==='Space'||e.key==='ArrowUp'||e.key.toLowerCase()==='w'){if(!player.jumping){player.vy=-13; player.jumping=true;} e.preventDefault();}
});
window.addEventListener('keyup',e=>{keys[e.key]=0; keys[e.key.toLowerCase()]=0;});
canvas.addEventListener('mousedown',()=>{if(!player.jumping){player.vy=-13; player.jumping=true;}});
canvas.addEventListener('touchstart',ev=>{ev.preventDefault(); if(!player.jumping){player.vy=-13; player.jumping=true;}});
</script></body></html>
