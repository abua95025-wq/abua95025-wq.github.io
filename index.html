<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#fff}canvas{width:100%;height:70vh;background:#87CEEB;display:block}#pad{display:flex;justify-content:center;gap:15px;padding:10px}.btn{width:70px;height:70px;background:#ddd;border:3px solid #000;border-radius:15px;font-size:30px;display:flex;align-items:center;justify-content:center}</style></head><body>
<div style="background:#000;color:#ff0;text-align:center;padding:10px;font:900 18px Arial">ЗЕЛЕНЫЙ=ТЫ, КРАСНЫЙ=ВРАГ, ЖЕЛТЫЙ=БЕРИ</div>
<canvas id="c"></canvas>
<div id="pad"><div class="btn" id="L">◀</div><div class="btn" id="U">▲</div><div class="btn" id="D">▼</div><div class="btn" id="R">▶</div></div>
<script>
let c=document.getElementById('c'), x=c.getContext('2d'), W=c.width=800, H=c.height=500;
let px=30, py=30, mx=600, my=400, k={}, s=0, coins=[[200,200],[500,100],[300,350]];
function draw(){x.fillStyle='#87CEEB'; x.fillRect(0,0,W,H); x.fillStyle='#444'; x.fillRect(150,0,20,400); x.fillRect(350,100,20,400); x.fillRect(0,250,500,20); x.fillStyle='yellow'; coins.forEach(o=>x.fillRect(o[0],o[1],18,18)); x.fillStyle='red'; x.fillRect(mx,my,22,22); x.fillStyle='lime'; x.fillRect(px,py,20,20);}
setInterval(()=>{let dx=0,dy=0; if(k.U)dy=-4; if(k.D)dy=4; if(k.L)dx=-4; if(k.R)dx=4; px+=dx; py+=dy; if(px<0)px=0; if(py<0)py=0; if(px>780)px=780; if(py>480)py=480; mx+=(px>mx?1:-1)*0.7; my+=(py>my?1:-1)*0.7; coins=coins.filter(o=>Math.abs(o[0]-px)<20&&Math.abs(o[1]-py)<20?false:true); if(coins.length==0){alert('ПОБЕДА'); location.reload()} if(Math.abs(px-mx)<20&&Math.abs(py-my)<20){alert('ПОЙМАН'); location.reload()} draw();},20);
['U','D','L','R'].forEach(id=>{let e=document.getElementById(id); e.ontouchstart=()=>k[id]=1; e.ontouchend=()=>k[id]=0; e.onmousedown=()=>k[id]=1; e.onmouseup=()=>k[id]=0;});
draw();
</script></body></html>
