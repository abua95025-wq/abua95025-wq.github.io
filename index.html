<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BUBBLE POP</title>
<style>
html,body{margin:0;height:100%;background:#070a14;overflow:hidden;font-family:Arial Black}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:#fff;text-align:center;pointer-events:none;text-shadow:0 2px 10px #000}
#ui #score{font-size:48px;line-height:1}
#ui #best{font-size:11px;opacity:.6;letter-spacing:2px}
#over{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:10;text-align:center}
#over button{padding:16px 48px;border-radius:30px;border:0;background:#6c5cff;color:#fff;font:900 18px Arial;margin-top:20px}
</style>
</head>
<body>
<div id="ui"><div id="score">0</div><div id="best">ТАПАЙ ПУЗЫРИ • НЕ ПРОПУСТИ 5 ШТУК</div></div>
<div id="over"><h1 style="font-size:44px;margin:0;color:#6c5cff">КОНЕЦ</h1><p id="final" style="opacity:.7"></p><button onclick="location.reload()">ЕЩЕ РАЗ</button></div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H; function resize(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);} resize(); addEventListener('resize',resize);

let bubbles=[], score=0, missed=0, run=true, lastSpawn=0;
const colors=['#6c5cff','#00f2ff','#ff5c8a','#ffcc00','#00ff88'];

function spawn(){
  const r=26+Math.random()*22;
  const x=r+Math.random()*(W-r*2);
  const y=H+r+20;
  const speed=1.2+Math.random()*1.8+score*0.02;
  const col=colors[Math.floor(Math.random()*colors.length)];
  bubbles.push({x,y,r,speed,col,pop:0});
}

function pop(b){
  score++; document.getElementById('score').innerText=score;
  b.pop=1; b.t=0;
}

function update(dt){
  if(!run) return;
  lastSpawn+=dt;
  if(lastSpawn> 520 - Math.min(400, score*6)){ lastSpawn=0; spawn(); if(score>15 && Math.random()<0.4) spawn(); }

  for(let i=bubbles.length-1;i>=0;i--){
    let b=bubbles[i];
    if(b.pop){
      b.t+=dt; b.r+=0.8;
      if(b.t>220){ bubbles.splice(i,1); }
    } else {
      b.y-=b.speed;
      b.x+=Math.sin(b.y*0.01)*0.4;
      if(b.y<-b.r-30){
        bubbles.splice(i,1);
        missed++;
        if(missed>=5){
          run=false;
          document.getElementById('over').style.display='flex';
          document.getElementById('final').innerText=`Очков: ${score} | Мой рекорд: 127`;
        }
      }
    }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.fillStyle='#070a14'; ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W/2,H*0.7,0,W/2,H*0.7,H);
  g.addColorStop(0,'rgba(108,92,255,.18)'); g.addColorStop(1,'rgba(7,10,20,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  bubbles.forEach(b=>{
    if(b.pop){
      ctx.globalAlpha=1-b.t/220;
      ctx.strokeStyle=b.col; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    } else {
     
      ctx.fillStyle=b.col;
      ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=0.35;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.28,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  });

 
  ctx.fillStyle='rgba(255,255,255,.15)';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.arc(20+i*18, H-18, 5,0,Math.PI*2);
    if(i<missed) {ctx.fillStyle='#ff4444'; ctx.fill(); ctx.fillStyle='rgba(255,255,255,.15)';}
    else ctx.strokeStyle='rgba(255,255,255,.25)', ctx.lineWidth=1.5, ctx.stroke();
  }
}

let last=performance.now();
(function loop(now){
  let dt=now-last; last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
})(performance.now());

function hit(px,py){
  if(!run) return;
  for(let i=bubbles.length-1;i>=0;i--){
    let b=bubbles[i];
    if(b.pop) continue;
    if(Math.hypot(px-b.x,py-b.y)<b.r+12){ pop(b); return; }
  }
}

cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  let t=e.touches[0]; hit(t.clientX,t.clientY);
},{passive:false});
cv.addEventListener('mousedown',e=> hit(e.clientX,e.clientY));


spawn(); setTimeout(spawn,400);
</script>
</body>
</html>
