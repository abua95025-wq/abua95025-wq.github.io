<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#7ec8f0;font-family:Arial;overflow:hidden}
#top{background:#e0f0ff;margin:10px;border-radius:20px;padding:10px;text-align:center;font:900 18px Arial;color:#2a4a9a}
#field{position:relative;width:95%;height:70vh;margin:0 auto;background:#7ec8f0;overflow:hidden;border:3px solid #2a4a9a;border-radius:15px}
.wall{position:absolute;background:#4a4e5e;border-radius:12px}
#me{position:absolute;width:28px;height:28px;background:#7ed957;border-radius:8px;left:50px;top:520px;z-index:10;border:3px solid #000;display:flex;align-items:center;justify-content:center}
#enemy{position:absolute;width:30px;height:30px;background:#ff4a4a;border-radius:10px;left:220px;top:360px;display:flex;align-items:center;justify-content:center}
.coin{position:absolute;width:26px;height:26px;background:#ffdd00;border-radius:6px;display:flex;align-items:center;justify-content:center}
#pad{display:flex;justify-content:center;gap:10px;padding:10px;background:#2a4a9a}
.b{width:60px;height:60px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;border:3px solid #000;user-select:none}
.b:active{background:yellow}
#help{text-align:center;background:#000;color:#ff0;padding:5px;font:700 14px Arial}
</style></head><body>
<div id="help">КЛАВА: WASD или СТРЕЛКИ ⬆️⬇️⬅️➡️</div>
<div id="top">SCORE: 0 | Жми WASD</div>
<div id="field">
<div class="wall" style="left:0;top:0;width:20px;height:300px"></div>
<div class="wall" style="left:0;top:0;width:150px;height:20px"></div>
<div class="wall" style="left:140px;top:0;width:20px;height:100px"></div>
<div class="wall" style="left:80px;top:80px;width:100px;height:20px"></div>
<div class="wall" style="left:200px;top:0;width:150px;height:20px"></div>
<div id="me">😊</div>
<div id="enemy">👹</div>
<div class="coin" style="left:200px;top:40px">⭐</div>
<div class="coin" style="left:220px;top:150px">⭐</div>
<div class="coin" style="left:300px;top:200px">⭐</div>
<div class="coin" style="left:30px;top:310px">⭐</div>
<div class="coin" style="left:80px;top:370px">⭐</div>
</div>
<div id="pad"><div class="b" id="L">◀</div><div class="b" id="U">▲</div><div class="b" id="D">▼</div><div class="b" id="R">▶</div></div>
<script>
let me=document.getElementById('me'), fx=50, fy=520, k={}, score=0;
let coins=document.querySelectorAll('.coin');
let en=document.getElementById('enemy'), ex=220, ey=360;

function update(){
 me.style.left=fx+'px'; me.style.top=fy+'px';
 en.style.left=ex+'px'; en.style.top=ey+'px';
}

setInterval(()=>{
 let dx=0, dy=0;
 if(k.U||k.W) dy=-5;
 if(k.D||k.S) dy=5;
 if(k.L||k.A) dx=-5;
 if(k.R||k.D2) dx=5;
 fx+=dx; fy+=dy;
 if(fx<0)fx=0; if(fy<0)fy=0; if(fx>350)fx=350; if(fy>600)fy=600;
 ex+=(fx>ex?1:-1)*0.6; ey+=(fy>ey?1:-1)*0.6;
 update();
 coins.forEach(c=>{
  if(c.style.display=='none') return;
  let cx=parseInt(c.style.left), cy=parseInt(c.style.top);
  if(Math.abs(cx-fx)<25 && Math.abs(cy-fy)<25){c.style.display='none'; score++; document.getElementById('top').innerText='SCORE: '+score+' | WASD работает!'; if(score==5){alert('ПОБЕДА!'); location.reload();}}
 });
 if(Math.abs(ex-fx)<25 && Math.abs(ey-fy)<25){alert('ПОЙМАЛИ!'); location.reload();}
},20);


 let key=e.key.toLowerCase();
 if(key=='w'||key=='ц') k.W=1;
 if(key=='s'||key=='ы') k.S=1;
 if(key=='a'||key=='ф') k.A=1;
 if(key=='d'||key=='в') k.D2=1;
 if(e.key=='ArrowUp') k.U=1;
 if(e.key=='ArrowDown') k.D=1;
 if(e.key=='ArrowLeft') k.L=1;
 if(e.key=='ArrowRight') k.R=1;
});
window.addEventListener('keyup',e=>{
 let key=e.key.toLowerCase();
 if(key=='w'||key=='ц') k.W=0;
 if(key=='s'||key=='ы') k.S=0;
 if(key=='a'||key=='ф') k.A=0;
 if(key=='d'||key=='в') k.D2=0;
 if(e.key=='ArrowUp') k.U=0;
 if(e.key=='ArrowDown') k.D=0;
 if(e.key=='ArrowLeft') k.L=0;
 if(e.key=='ArrowRight') k.R=0;
});


function bind(id,key){let e=document.getElementById(id); e.ontouchstart=(ev)=>{ev.preventDefault(); k[key]=1}; e.ontouchend=()=>k[key]=0; e.onmousedown=()=>k[key]=1; e.onmouseup=()=>k[key]=0; e.onmouseleave=()=>k[key]=0;}
bind('U','U'); bind('D','D'); bind('L','L'); bind('R','R');
update();
</script></body></html>
